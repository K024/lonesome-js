name: Windows build probe

# Minimal probe for the x86_64-pc-windows-msvc build: no publish, no other
# runners. Triggers on push to the probe branch (adjust the name as needed).
on:
  push:
    branches: ['windows-build-test']

permissions:
  contents: read

jobs:
  build-windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node -v
          npm -v
          rustc -V
          cargo -V
          perl -v
          where.exe link.exe
          where.exe cl.exe
          where.exe nasm
          if ($LASTEXITCODE -ne 0) { Write-Output 'nasm not found (openssl-src will build with no-asm)' }
          # probe step should never fail by itself; real problems surface in the build step
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        run: npm run build -- --target x86_64-pc-windows-msvc

      - name: Verify build output
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length
