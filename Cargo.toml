[package]
name = "lonesome_js"
edition = "2021"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
arc-swap = "1.9.2"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.0"
cel = "0.14.0"
chrono = "0.4.45"
dashmap = "6.2.1"
form_urlencoded = "1.2.2"
futures = "0.3.32"
hashbrown = "0.17.1"
http = "1.4.2"
ipnet = "2.12.0"
josekit = "0.10.3"
napi = { version = "3.10.3", features = ["async", "anyhow", "serde-json"] }
napi-derive = "3.5.9"
password-auth = { version = "1.0.0", features = ["default", "scrypt", "pbkdf2"] }
percent-encoding = "2.3.2"
pingora = { version = "0.8.1", features = ["openssl", "proxy", "lb", "cache", "time"] }
pingora-limits = "0.8.1"
pingora-lru = "0.8.1"
pingora-runtime = "0.8.1"
rand = "0.10.2"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
